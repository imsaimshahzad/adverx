name: AdverX Lint and Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test shared API helpers
        run: npm run test:api

      - name: Test refresh queue race
        run: npm run test:refresh

      - name: Run ESLint
        run: "npm run lint -- --rule 'prettier/prettier: off'"

      - name: Build project
        if: always()
        run: npm run build
